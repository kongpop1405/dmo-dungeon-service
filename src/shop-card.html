<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMO Dungeon Service — รูปการ์ดสินค้า</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#020912; display:flex; justify-content:center; padding:24px 12px}
  /* 16:9 header of a product card on dmo-decks shop.html; the name is printed under the
     picture there, so the picture carries none */
  .card{position:relative; width:480px; height:270px; overflow:hidden;
    background:radial-gradient(circle at 75% 45%,#1d3a66,#0a1426 70%)}
  .card img{position:absolute; right:4%; top:6%; height:88%; width:auto; max-width:62%; object-fit:contain}
</style>
</head>
<body>
  <div class="card" id="poster"></div>

<script src="render-ready.js"></script>
<script>
// ?only=<unlockItems id> — one card per picture
loadJson('data/poster.json').then(d => {
  const only = new URLSearchParams(location.search).get('only');
  const it = d.unlockItems.items.find(x => x.id === only);
  if (!it) throw new Error('no unlock item ' + only);
  const img = document.createElement('img');
  img.src = it.image;
  img.alt = '';
  document.getElementById('poster').appendChild(img);
}).then(renderReady).catch(renderFail);
</script>
</body>
</html>
